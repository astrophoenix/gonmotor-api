# Producción en Render (Blueprint). Todo en Ohio para usar la red privada.
# Los servicios actuales se crearon a mano desde el panel; este archivo documenta
# esa configuración y permite recrearla con New → Blueprint si hiciera falta.
# Los valores con `sync: false` se cargan en el panel (no van en git).

databases:
  - name: gonmotor-db
    databaseName: gonmotor
    user: gonmotor_app
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    diskSizeGB: 1
    # Sin IPs permitidas: solo accesible por la red privada de Render.
    ipAllowList: []

envVarGroups:
  # Variables comunes a la API y al cron.
  - name: gonmotor-comun
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      # WhatsApp: mock (sin envíos). Para Meta, definir WHATSAPP_MODE=meta_api,
      # WHATSAPP_META_TOKEN, WHATSAPP_META_PHONE_NUMBER_ID y las plantillas
      # (ver apps/notificaciones/services/whatsapp.py).
      - key: WHATSAPP_MODE
        value: mock
      # Correo por la API de Resend (django-anymail). El remitente debe ser de un
      # dominio verificado, p. ej. "GonMotor <avisos@tudominio.com>".
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

services:
  - type: web
    name: gonmotor-api
    runtime: python
    plan: starter
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 2
    healthCheckPath: /api/core/health/
    envVars:
      - fromGroup: gonmotor-comun
      - key: DB_HOST
        fromDatabase: { name: gonmotor-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: gonmotor-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: gonmotor-db, property: database }
      - key: DB_USER
        fromDatabase: { name: gonmotor-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: gonmotor-db, property: password }
      # p. ej. "api.tudominio.com,gonmotor-api.onrender.com"
      - key: ALLOWED_HOSTS
        sync: false
      # p. ej. "https://app.tudominio.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_TEXT_API_KEY
        sync: false
      - key: AI_TEXT_BASE_URL
        value: https://api.groq.com/openai/v1
      # AI_TEXT_MODEL opcional: si no se define, el backend elige un modelo disponible.

  # Cola de notificaciones (recordatorios de cita de 2 h): cada 15 minutos.
  # Reemplaza al cron externo de GitHub Actions.
  - type: cron
    name: gonmotor-notificaciones
    runtime: python
    plan: starter
    region: ohio
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py procesar_notificaciones
    envVars:
      - fromGroup: gonmotor-comun
      - key: DB_HOST
        fromDatabase: { name: gonmotor-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: gonmotor-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: gonmotor-db, property: database }
      - key: DB_USER
        fromDatabase: { name: gonmotor-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: gonmotor-db, property: password }
      # Producción no tiene default para ALLOWED_HOSTS; el cron no atiende HTTP.
      - key: ALLOWED_HOSTS
        value: localhost
