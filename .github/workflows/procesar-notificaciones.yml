# Cron externo de la cola de notificaciones (Render gratuito no tiene cron jobs).
#
# Llama cada 15 minutos a POST /api/notificaciones/cron/procesar/ con la
# cabecera X-Cron-Token. Configurar en GitHub → Settings → Secrets and
# variables → Actions:
#   - GONMOTOR_API_URL           p. ej. https://gonmotor-api.onrender.com
#   - NOTIFICACIONES_CRON_TOKEN  el mismo valor que la variable de Render
# Sin esos secretos el job termina sin hacer nada.
name: Procesar notificaciones

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint de la cola
        env:
          API_URL: ${{ secrets.GONMOTOR_API_URL }}
          CRON_TOKEN: ${{ secrets.NOTIFICACIONES_CRON_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "Faltan GONMOTOR_API_URL o NOTIFICACIONES_CRON_TOKEN: se omite."
            exit 0
          fi
          # El plan gratuito de Render puede tardar en despertar: reintentos con espera.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Token: $CRON_TOKEN" \
            "${API_URL%/}/api/notificaciones/cron/procesar/"
