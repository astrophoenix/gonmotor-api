{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Mantify</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body class="bg-gray-50">

<div class="flex flex-col justify-center items-center min-h-screen px-6">

    <!-- Logo -->
    <div class="mb-8 text-center">

        <h1 class="text-4xl font-bold text-cyan-600">
            Mantify
        </h1>

        <p class="text-gray-500 mt-2">
            Sistema de mantenimientos
        </p>

    </div>

    <!-- Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-2xl font-bold text-gray-800 mb-6">
            Iniciar sesión
        </h2>

        {% if form.errors %}
            <div class="mb-4 p-4 rounded-lg bg-red-100 text-red-700">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->
            <div class="mb-5">

                <label class="block mb-2 text-sm font-medium text-gray-700">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="w-full rounded-lg border border-gray-300 bg-gray-50 p-3 focus:border-cyan-500 focus:ring-cyan-500"
                    placeholder="Ingrese usuario"
                    required
                >

            </div>

            <!-- Password -->
            <div class="mb-6">

                <label class="block mb-2 text-sm font-medium text-gray-700">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="w-full rounded-lg border border-gray-300 bg-gray-50 p-3 focus:border-cyan-500 focus:ring-cyan-500"
                    placeholder="Ingrese contraseña"
                    required
                >

            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full rounded-lg bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-3 transition"
            >
                Ingresar
            </button>

        </form>

    </div>

</div>

<script src="{% static 'js/app.js' %}"></script>

</body>
</html>
